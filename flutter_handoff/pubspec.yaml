name: omnimind_flutter
description: Flutter migration starter for OmniMind. Resolve package versions in the target Flutter environment.
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: any
  flutter_riverpod: any
  http: any
  flutter_secure_storage: any
  shared_preferences: any
  flutter_appauth: any
  app_links: any
  file_picker: any
  flutter_tts: any
  haptic_feedback: any
  url_launcher: any
  share_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
