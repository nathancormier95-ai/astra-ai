name: omnimind_flutter
description: Privacy-conscious all-in-one AI workspace for Android, migrated from OmniMind's Expo client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: any
  flutter_riverpod: any
  http: any
  flutter_secure_storage: any
  shared_preferences: any
  flutter_appauth: any
  app_links: any
  file_picker: any
  flutter_tts: any
  haptic_feedback: any
  url_launcher: any
  share_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
